<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Sin conexión — Gestión de Stock</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #343a40;
      color: #f8f9fa;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 24px;
    }
    .icon { font-size: 72px; margin-bottom: 24px; }
    h1 { font-size: 28px; margin-bottom: 12px; color: #d4af37; }
    p { font-size: 16px; color: #adb5bd; margin-bottom: 32px; line-height: 1.5; }
    button {
      background: #d4af37;
      color: #343a40;
      border: none;
      padding: 12px 32px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover { background: #c9a22e; }
  </style>
</head>
<body>
  <div class="icon">📡</div>
  <h1>Sin conexión</h1>
  <p>No se pudo conectar al servidor.<br>Verificá tu conexión a internet e intentá de nuevo.</p>
  <button onclick="location.reload()">Reintentar</button>
</body>
</html>
